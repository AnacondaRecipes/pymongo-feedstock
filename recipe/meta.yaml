{% set name = "pymongo" %}
{% set version = "4.18.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mongodb/mongo-python-driver/archive/{{ version }}.tar.gz
  sha256: e0d91aa64a64f8daa69e7097823d879b047b84ba13a704785d0242e87baf6f64

# Upstream source - https://github.com/mongodb/mongo-python-driver/blob/4.18.1/pyproject.toml
build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - hatchling >1.24
    - hatch-requirements-txt >=0.4.1
    - setuptools >=65.0
  run:
    - python
    # Upstream source for dnspython - https://github.com/mongodb/mongo-python-driver/blob/4.18.1/requirements.txt
    - dnspython >=2.7.0,<3.0.0
  run_constrained:
    # Upstream source - https://github.com/mongodb/mongo-python-driver/blob/4.18.2/pyproject.toml#L94
    # aws.txt
    - pymongo-auth-aws >=1.3.0,<2.0.0
    # encryption.txt
    - pymongocrypt >=1.18.1,<2.0.0
    - certifi >=2023.7.22  # [osx]
    # gssapi.txt
    - pykerberos >=1.2.4
    - winkerberos>=0.12.2
    # ocsp.txt
    - certifi >=2023.7.22  # [osx]
    - pyopenssl >=26.2.0
    - requests >=2.23.0,<3.0
    - cryptography >=47.0.0
    - service_identity >=24.2.0
    # zstd.txt
    - backports.zstd >=1.0.0  # [py<314]
    # snappy.txt
    - python-snappy >=0.7.3

{% set deselected_tests = "" %}
{% set deselected_tests = " --deselect=test/test_srv_polling.py::TestSrvPolling::test_dns_failures_logging" %}  # [win]
test:
  source_files:
    - test
    - pyproject.toml
  imports:
    - bson
    - gridfs
    - pymongo
  requires:
    - pip
    - pytest >=8.2
    # mockupdb is not maintained and not available for Python 3.14 and later
    - mockupdb  # [py<314]
    - pytest-asyncio >=0.24.0
    - importlib_metadata >=7.0  # [py<313]
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv test {{ deselected_tests }}

about:
  home: https://www.mongodb.com/
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: PyMongo - the Official MongoDB Python driver
  description: |
    The PyMongo distribution contains tools for interacting with MongoDB
    database from Python. The bson package is an implementation of the
    BSON format for Python. The pymongo package is a native Python driver
    for MongoDB. The gridfs package is a gridfs implementation on top of pymongo.
  dev_url: https://github.com/mongodb/mongo-python-driver
  doc_url: https://www.mongodb.com/docs/languages/python/pymongo-driver/current/

extra:
  recipe-maintainers:
    - licode
    - jakirkham
    - tacaswell
    - CJ-Wright
